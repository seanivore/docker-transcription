version: '3'

services:
  whisper:
    image: python:3.10-slim
    container_name: whisper-transcription
    volumes:
      - ./data:/data
      - ./app:/app
    restart: unless-stopped
    command: >
      bash -c "apt-get update && apt-get install -y ffmpeg && pip install openai-whisper && python /app/transcribe.py"
    # Optional environment variables can be added here if needed
    # environment:
    #   - KEY=value

volumes:
  data:
    driver: local 