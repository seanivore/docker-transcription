services:
  whisper:
    build: .
    container_name: whisper-transcription
    environment:
      # Model accuracy/speed knob. large-v3 = multilingual, top accuracy.
      # Drop to "medium" or "small" if RAM is tight; no rebuild needed.
      - WHISPER_MODEL=large-v3
      # - WHISPER_COMPUTE_TYPE=int8   # int8 (default) is lightest on CPU
    volumes:
      - ./data:/data
      - ./app:/app
      # Persist downloaded models across rebuilds (first run fetches ~1-3 GB).
      - whisper-cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  whisper-cache:
    driver: local
